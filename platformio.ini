[platformio]
default_envs = base

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<base/> -<bracos/> -<.git/>
lib_deps =
    esphome/AsyncTCP-esphome @ ^2.0.0
    esphome/ESPAsyncWebServer-esphome @ ^3.0.0

[env:bracos]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<bracos/> -<base/> -<.git/>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5